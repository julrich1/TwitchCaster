<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TwitchCaster Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@200;300&display=swap" rel="stylesheet">
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #070710; overflow: hidden; }

    #player {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
      z-index: 1;
    }
    #player.active { display: block; }

    /* ── Idle screen ── */
    #idle-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      font-family: 'Exo 2', sans-serif;
      background: #070710;
    }

    /* Aurora glow */
    .idle-aurora {
      position: absolute;
      inset: -30%;
      width: 160%;
      height: 160%;
      background:
        radial-gradient(ellipse 60% 50% at 15% 60%, rgba(145,70,255,.20) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 22%, rgba(100,40,200,.15) 0%, transparent 55%),
        radial-gradient(ellipse 40% 55% at 52% 92%, rgba(0,180,255,.09) 0%, transparent 50%);
      animation: idle-aurora 28s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes idle-aurora {
      from { transform: translate(0,0) rotate(0deg); }
      to   { transform: translate(-4%,3%) rotate(3deg); }
    }

    /* Subtle grid */
    .idle-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(145,70,255,.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(145,70,255,.032) 1px, transparent 1px);
      background-size: 80px 80px;
      animation: idle-grid 70s linear infinite;
    }
    @keyframes idle-grid {
      to { background-position: 80px 80px; }
    }

    /* Vignette */
    .idle-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 82% 82% at 50% 50%, transparent 25%, rgba(0,0,0,.78) 100%);
    }

    /* Floating color orbs */
    .idle-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
    }
    .idle-orb-1 {
      width: 700px; height: 700px;
      top: -220px; left: -180px;
      background: radial-gradient(circle, rgba(145,70,255,.22) 0%, transparent 70%);
      animation: orb1 32s ease-in-out infinite;
    }
    .idle-orb-2 {
      width: 580px; height: 580px;
      bottom: -160px; right: -120px;
      background: radial-gradient(circle, rgba(0,190,255,.11) 0%, transparent 70%);
      animation: orb2 26s ease-in-out infinite;
    }
    @keyframes orb1 {
      0%,100% { transform: translate(0,0); }
      50%     { transform: translate(110px,70px); }
    }
    @keyframes orb2 {
      0%,100% { transform: translate(0,0); }
      50%     { transform: translate(-70px,-55px); }
    }

    /* Corner viewfinder brackets */
    .idle-corner {
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: rgba(145,70,255,.38);
      border-style: solid;
    }
    .idle-corner-tl { top: 44px;    left: 44px;    border-width: 2px 0 0 2px; }
    .idle-corner-tr { top: 44px;    right: 44px;   border-width: 2px 2px 0 0; }
    .idle-corner-bl { bottom: 44px; left: 44px;    border-width: 0 0 2px 2px; }
    .idle-corner-br { bottom: 44px; right: 44px;   border-width: 0 2px 2px 0; }

    /* Center content */
    .idle-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Spinning monogram badge */
    .idle-badge {
      position: relative;
      width: 116px;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }
    .idle-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #9146FF 0%, #c084fc 25%, rgba(0,212,255,.6) 40%, transparent 55%, transparent 72%, #9146FF 100%);
      animation: badge-spin 9s linear infinite;
    }
    .idle-badge::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #070710;
    }
    .idle-badge-inner {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(145,70,255,.22);
      z-index: 1;
    }
    .idle-badge-letter {
      position: relative;
      z-index: 2;
      font-family: 'Orbitron', monospace;
      font-size: 42px;
      font-weight: 900;
      color: #9146FF;
      text-shadow: 0 0 28px rgba(145,70,255,.7);
      line-height: 1;
    }
    @keyframes badge-spin {
      to { transform: rotate(360deg); }
    }

    /* Logotype */
    .idle-title {
      font-family: 'Orbitron', monospace;
      font-size: 84px;
      font-weight: 900;
      letter-spacing: -.01em;
      line-height: 1;
      margin: 0;
    }
    .idle-title-twitch {
      color: #9146FF;
      text-shadow: 0 0 55px rgba(145,70,255,.55), 0 0 110px rgba(145,70,255,.2);
    }
    .idle-title-caster {
      color: #fff;
      text-shadow: 0 0 35px rgba(255,255,255,.12);
    }

    /* Divider */
    .idle-divider {
      width: 380px;
      height: 1px;
      margin: 30px 0 26px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(145,70,255,.55) 20%,
        rgba(145,70,255,.55) 80%,
        transparent 100%);
    }

    /* Subtitle */
    .idle-subtitle {
      font-size: 13px;
      font-weight: 200;
      letter-spacing: .52em;
      color: rgba(255,255,255,.26);
      text-transform: uppercase;
    }

    /* Pulsing wait dots */
    .idle-dots {
      display: flex;
      gap: 10px;
      margin-top: 40px;
    }
    .idle-dots i {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9146FF;
      animation: idle-dot 2.1s ease-in-out infinite;
    }
    .idle-dots i:nth-child(2) { animation-delay: .32s; }
    .idle-dots i:nth-child(3) { animation-delay: .64s; }
    @keyframes idle-dot {
      0%,55%,100% { opacity: .18; transform: scale(.75); }
      27%          { opacity: 1;   transform: scale(1);   }
    }

    /* Footer status */
    .idle-footer {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 24px;
      border: 1px solid rgba(145,70,255,.18);
      background: rgba(145,70,255,.06);
    }
    .idle-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9146FF;
      box-shadow: 0 0 8px #9146FF, 0 0 18px rgba(145,70,255,.45);
      animation: status-blink 2.8s ease-in-out infinite;
    }
    @keyframes status-blink {
      0%,100% { opacity: 1; }
      50%     { opacity: .28; }
    }
    .idle-footer span {
      font-size: 11px;
      font-weight: 200;
      letter-spacing: .48em;
      color: rgba(255,255,255,.28);
      text-transform: uppercase;
    }

    /* ── Quality overlay (shown on keypress) ── */
    #quality-overlay {
      display: none;
      position: fixed;
      top: 52px;
      right: 60px;
      z-index: 3;
      align-items: baseline;
      gap: 14px;
    }
    #quality-res {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(145,70,255,.65);
    }
    #quality-fps {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .08em;
    }

    /* ── Stream metadata (bottom left, always visible while playing) ── */
    #meta-overlay {
      display: none;
      position: fixed;
      bottom: 52px;
      left: 60px;
      z-index: 3;
      flex-direction: column;
      gap: 8px;
      max-width: 680px;
    }
    #meta-streamer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
      letter-spacing: .06em;
    }
    #meta-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4040;
      box-shadow: 0 0 6px rgba(255,64,64,.9), 0 0 14px rgba(255,64,64,.4);
      flex-shrink: 0;
    }
    #meta-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 22px;
      font-weight: 300;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
      line-height: 1.3;
    }
    #meta-game {
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      font-weight: 200;
      color: #c084fc;
      text-shadow: 0 1px 6px rgba(0,0,0,.8);
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <!-- No autoplay: playback is buffer-gated in JS (see maybeStartPlayback). -->
  <video id="player" playsinline></video>

  <div id="idle-screen">
    <div class="idle-aurora"></div>
    <div class="idle-grid"></div>
    <div class="idle-vignette"></div>
    <div class="idle-orb idle-orb-1"></div>
    <div class="idle-orb idle-orb-2"></div>

    <div class="idle-corner idle-corner-tl"></div>
    <div class="idle-corner idle-corner-tr"></div>
    <div class="idle-corner idle-corner-bl"></div>
    <div class="idle-corner idle-corner-br"></div>

    <div class="idle-center">
      <div class="idle-badge">
        <div class="idle-badge-inner"></div>
        <span class="idle-badge-letter">T</span>
      </div>
      <h1 class="idle-title">
        <span class="idle-title-twitch">Twitch</span><span class="idle-title-caster">Caster</span>
      </h1>
      <div class="idle-divider"></div>
      <p class="idle-subtitle">Live Stream Receiver</p>
      <div class="idle-dots"><i></i><i></i><i></i></div>
    </div>

    <div class="idle-footer">
      <div class="idle-status-dot"></div>
      <span>Ready to Cast</span>
    </div>
  </div>

  <div id="quality-overlay">
    <span id="quality-res"></span>
    <span id="quality-fps"></span>
  </div>

  <div id="meta-overlay">
    <div id="meta-streamer">
      <div id="meta-live-dot"></div>
      <span id="meta-streamer-text"></span>
    </div>
    <div id="meta-title"></div>
    <div id="meta-game"></div>
  </div>

  <script>
    // Jitter cushion: playback starts once this many seconds are buffered.
    // Raise for more stall protection, lower for faster startup.
    var START_BUFFER_SECONDS = 8;
    // Failsafe: start playback after this long even if the buffer never
    // reaches START_BUFFER_SECONDS (slow/low-fps pipelines).
    var PLAYBACK_FAILSAFE_MS = 12000;

    // Heartbeat: post playback progress to the server every this many ms so it
    // can detect a frozen playhead and force a rebuild. Errors are batched and
    // piggy-backed on the next heartbeat.
    var HEARTBEAT_MS = 5000;

    // Gap jumping: MSE parks the playhead at the end of a buffered range and
    // waits forever when the next range starts past a timeline hole (a segment
    // timestamp discontinuity, usually from an upstream Twitch ad/reconnect).
    // The watchdog detects the stall and seeks across the hole — far cheaper
    // than the server's full player rebuild, which stays as the fallback.
    var STALL_POLL_MS = 1000;     // how often to check the playhead for a stall
    var GAP_STALL_MS = 2500;      // no progress for this long counts as stalled
    var MAX_GAP_JUMP_S = 15;      // don't auto-jump holes larger than this

    // A failed segment fetch is retried on subsequent manifest polls, up to
    // this many total attempts, before being skipped for good — only then does
    // it leave a timeline hole for the gap jumper to hop.
    var MAX_SEG_FETCH_ATTEMPTS = 3;

    var deviceHlsId = '';

    var video = document.getElementById('player');

    // ── Error reporting ──────────────────────────────────────────────────────
    // Playback-relevant errors accumulate here and ride the next heartbeat. The
    // server logs them; healthy heartbeats stay silent.
    var receiverErrors = [];
    function reportError(msg) {
      try { msg = String(msg); } catch(e) { msg = 'unstringifiable error'; }
      console.error('[receiver]', msg);
      if (receiverErrors.length < 20) receiverErrors.push(msg);
    }

    video.addEventListener('error', function() {
      var err = video.error;
      reportError('video element error' + (err ? ' code=' + err.code + (err.message ? ' ' + err.message : '') : ''));
    });
    var streamLogin = null;
    var pollingInterval = null;
    var qualityOverlayTimer = null;
    var currentViewerCount = 0;
    var activeStreamURL = null;

    // ── HLS / MSE player ────────────────────────────────────────────────────

    var mediaSource = null;
    var sourceBuffer = null;
    var initSegmentURL = null;
    var seenSequences = new Set();
    var segFetchFails = {};  // seq → consecutive failed fetch attempts
    var hlsLoopTimer = null;
    var hlsGen = 0;
    var appending = false;
    var appendQueue = [];
    var playbackStarted = false;
    var playbackFailsafeTimer = null;
    var lastAppendAt = 0;  // ms timestamp of the last successful segment append
    var lastFetchAt = 0;   // ms timestamp of the last freshly-fetched segment

    function resetPlayer() {
      hlsGen++;
      if (hlsLoopTimer) { clearTimeout(hlsLoopTimer); hlsLoopTimer = null; }
      if (playbackFailsafeTimer) { clearTimeout(playbackFailsafeTimer); playbackFailsafeTimer = null; }
      if (mediaSource && mediaSource.readyState === 'open') {
        try { mediaSource.endOfStream(); } catch(e) {}
      }
      mediaSource = null;
      sourceBuffer = null;
      initSegmentURL = null;
      seenSequences = new Set();
      segFetchFails = {};
      appending = false;
      appendQueue = [];
      playbackStarted = false;
      lastAppendAt = 0;
      lastFetchAt = 0;
      video.src = '';
    }

    // ── Buffer-gated playback start ─────────────────────────────────────────
    // Segments are appended as fast as they arrive, but playback only begins
    // once START_BUFFER_SECONDS are buffered (or the failsafe fires). This
    // keeps the jitter cushion while overlapping it with pipeline startup.

    function maybeStartPlayback() {
      if (playbackStarted || !video.buffered.length) return;
      var start = video.buffered.start(0);
      var end = video.buffered.end(video.buffered.length - 1);
      if (end - start >= START_BUFFER_SECONDS) startPlayback();
    }

    function startPlayback() {
      if (playbackStarted) return;
      playbackStarted = true;
      if (playbackFailsafeTimer) { clearTimeout(playbackFailsafeTimer); playbackFailsafeTimer = null; }
      if (video.buffered.length && video.currentTime < video.buffered.start(0)) {
        try { video.currentTime = video.buffered.start(0); } catch(e) {}
      }
      var p = video.play();
      if (p && p.catch) p.catch(function() {});
    }

    function drainQueue() {
      if (appending || appendQueue.length === 0 || !sourceBuffer || sourceBuffer.updating) return;
      appending = true;
      var buf = appendQueue[0];
      try {
        sourceBuffer.appendBuffer(buf);
        appendQueue.shift();
      } catch(e) {
        appending = false;
        if (e.name === 'QuotaExceededError' && pruneForQuota()) {
          // Keep the segment queued; the remove()'s updateend re-runs
          // drainQueue, retrying the same append against the freed quota.
          return;
        }
        appendQueue.shift();
        reportError('appendBuffer failed: ' + e);
      }
    }

    // Emergency back-buffer trim when appendBuffer hits the device's media
    // quota (small on smart displays). Trims well past pruneBuffer's normal
    // 30s keep-behind. Returns true if a remove() was started.
    function pruneForQuota() {
      if (!sourceBuffer || sourceBuffer.updating || !video.buffered.length) return false;
      var start = video.buffered.start(0);
      var behind = video.currentTime - 5;
      if (behind <= start) return false;
      try {
        sourceBuffer.remove(start, behind);
        return true;
      } catch(e) {
        return false;
      }
    }

    function codecString(codec) {
      if (codec === 'av01')       return 'av01.0.12M.08, mp4a.40.2';
      if (codec === 'hev1')       return 'hev1.1.6.L150.B0, mp4a.40.2';
      if (codec === 'hvc1')       return 'hvc1.1.6.L150.B0, mp4a.40.2';
      if (codec === 'av1')        return 'av01.0.12M.08, mp4a.40.2';  // legacy
      if (codec === 'hevc')       return 'hev1.1.6.L150.B0, mp4a.40.2'; // legacy
      return 'avc1.64001F, mp4a.40.2'; // h264 default
    }

    function startHLS(manifestURL, codec) {
      resetPlayer();
      var gen = hlsGen;
      mediaSource = new MediaSource();
      video.src = URL.createObjectURL(mediaSource);

      mediaSource.addEventListener('sourceopen', function() {
        if (gen !== hlsGen) return;
        var codecs = codecString(codec);
        if (!MediaSource.isTypeSupported('video/mp4; codecs="' + codecs + '"')) {
          codecs = 'avc1.42E01E, mp4a.40.2'; // baseline fallback
        }
        try {
          sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="' + codecs + '"');
        } catch(e) {
          reportError('addSourceBuffer failed (' + codecs + '): ' + e);
          return;
        }
        sourceBuffer.mode = 'segments';
        sourceBuffer.addEventListener('error', function() {
          reportError('sourceBuffer error');
        });
        sourceBuffer.addEventListener('updateend', function() {
          appending = false;
          lastAppendAt = Date.now();
          pruneBuffer();
          maybeStartPlayback();
          drainQueue();
        });
        hlsLoop(manifestURL, gen);
      });

      playbackFailsafeTimer = setTimeout(function() {
        if (gen !== hlsGen) return;
        playbackFailsafeTimer = null;
        startPlayback();
      }, PLAYBACK_FAILSAFE_MS);
    }

    function pruneBuffer() {
      if (!sourceBuffer || sourceBuffer.updating || !video.buffered.length) return;
      var behind = video.currentTime - 30;
      if (behind > 0 && video.buffered.start(0) < behind) {
        try { sourceBuffer.remove(0, behind); } catch(e) {}
      }
    }

    function hlsLoop(manifestURL, gen) {
      if (gen !== hlsGen) return;
      fetchManifest(manifestURL).then(function(segments) {
        if (gen !== hlsGen) return;
        // Only consider the last 10 segments (~20s) to stay near the live edge
        // and avoid fetching minutes of backlog on initial load.
        var window = segments.slice(Math.max(0, segments.length - 10));
        // Drop fail counters for seqs that rotated out of the window unresolved.
        if (window.length) {
          for (var k in segFetchFails) { if (+k < window[0].seq) delete segFetchFails[k]; }
        }
        var pending = window.filter(function(s) { return !seenSequences.has(s.seq); });
        if (pending.length === 0) {
          hlsLoopTimer = setTimeout(function() { hlsLoop(manifestURL, gen); }, 2000);
          return;
        }
        fetchAndAppend(pending, gen, function() {
          if (gen !== hlsGen) return;
          // Poll sooner after appending — the next segment may be nearly ready.
          hlsLoopTimer = setTimeout(function() { hlsLoop(manifestURL, gen); }, 800);
        });
      }).catch(function() {
        if (gen !== hlsGen) return;
        hlsLoopTimer = setTimeout(function() { hlsLoop(manifestURL, gen); }, 3000);
      });
    }

    // Fetch all pending segments in parallel, then append in sequence order.
    function fetchAndAppend(segments, gen, done) {
      var promises = segments.map(function(seg) {
        return fetch(seg.url)
          .then(function(r) {
            if (!r.ok) throw new Error('segment ' + r.status);
            return r.arrayBuffer();
          })
          .then(function(buf) { return { seq: seg.seq, buf: new Uint8Array(buf) }; })
          .catch(function() { return { seq: seg.seq, buf: null }; });
      });
      Promise.all(promises).then(function(results) {
        if (gen !== hlsGen) return;
        results.forEach(function(r) {
          if (r.buf) {
            seenSequences.add(r.seq);
            delete segFetchFails[r.seq];
            appendQueue.push(r.buf);
            lastFetchAt = Date.now();
          } else {
            // Transient failure: leave the seq unseen so the next manifest
            // poll retries it. Only after MAX_SEG_FETCH_ATTEMPTS is it skipped
            // for good, leaving a hole for the gap jumper.
            var fails = (segFetchFails[r.seq] || 0) + 1;
            if (fails >= MAX_SEG_FETCH_ATTEMPTS) {
              reportError('segment ' + r.seq + ' skipped after ' + fails + ' failed fetches');
              seenSequences.add(r.seq);
              delete segFetchFails[r.seq];
            } else {
              segFetchFails[r.seq] = fails;
            }
          }
        });
        drainQueue();
        done();
      });
    }

    // Returns [{seq, url}] for segments not yet seen, after fetching init if needed.
    function fetchManifest(manifestURL) {
      return fetch(manifestURL + '?_=' + Date.now())
        .then(function(r) {
          if (!r.ok) throw new Error('manifest ' + r.status);
          return r.text();
        })
        .then(function(text) {
          var base = manifestURL.substring(0, manifestURL.lastIndexOf('/') + 1);
          var lines = text.split('\n');
          var seq = 0;
          var segments = [];
          var mapURI = null;

          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.startsWith('#EXT-X-MEDIA-SEQUENCE:')) {
              seq = parseInt(line.split(':')[1], 10);
            } else if (line.startsWith('#EXT-X-MAP:URI="')) {
              mapURI = line.match(/#EXT-X-MAP:URI="([^"]+)"/)[1];
              if (!mapURI.startsWith('http')) mapURI = base + mapURI;
            } else if (line && !line.startsWith('#')) {
              var url = line.startsWith('http') ? line : base + line;
              segments.push({ seq: seq, url: url });
              seq++;
            }
          }

          // Fetch and prepend init segment the first time we see it.
          if (mapURI && mapURI !== initSegmentURL) {
            initSegmentURL = mapURI;
            return fetch(mapURI)
              .then(function(r) { return r.arrayBuffer(); })
              .then(function(buf) {
                appendQueue.unshift(new Uint8Array(buf));
                drainQueue();
                return segments;
              });
          }
          return segments;
        });
    }

    // ── Stream state polling ─────────────────────────────────────────────────

    var streamPollTimer = null;
    var activeStreamSeq = 0;
    var pollFailures = 0;
    var fastPollUntil = 0;

    function startStreamPoll() {
      if (!deviceHlsId) return;
      // The receiver was just launched, so a cast is imminent — poll fast to
      // pick the stream up the moment the server publishes it.
      fastPollUntil = Date.now() + 30000;
      pollCurrentStream();
    }

    // 500ms right after boot (discovery latency matters most there), 1s on
    // the idle screen (fast re-cast pickup), 2s while playing.
    function pollDelay() {
      if (Date.now() < fastPollUntil) return 500;
      return activeStreamURL !== null ? 2000 : 1000;
    }

    function pollCurrentStream() {
      fetch('/current-stream/' + deviceHlsId)
        .then(function(r) {
          pollFailures = 0;
          if (r.status === 204) {
            if (activeStreamURL !== null) showIdleScreen();
            streamPollTimer = setTimeout(pollCurrentStream, pollDelay());
            return null;
          }
          return r.json();
        })
        .then(function(data) {
          if (!data) return;
          if (data.seq !== activeStreamSeq) {
            activeStreamSeq = data.seq;
            activeStreamURL = data.url;
            streamLogin = data.login || null;
            onStreamStart(data);
          }
          streamPollTimer = setTimeout(pollCurrentStream, pollDelay());
        })
        .catch(function() {
          pollFailures++;
          if (pollFailures >= 3 && activeStreamURL !== null) showIdleScreen();
          streamPollTimer = setTimeout(pollCurrentStream, 3000);
        });
    }

    function onStreamStart(data) {
      document.getElementById('idle-screen').style.display = 'none';
      video.classList.add('active');
      if (data.resolution) document.getElementById('quality-res').textContent = data.resolution;
      if (data.fps) document.getElementById('quality-fps').textContent = data.fps;
      setViewerCount(data.viewerCount || 0);
      updateMetaStreamer();

      startHLS(data.url, data.codec);
      startStreamInfoPolling();
      startHeartbeat();
      startStallWatch();
      showOverlays();
    }

    function showIdleScreen() {
      resetPlayer();
      activeStreamURL = null;
      activeStreamSeq = 0;
      pollFailures = 0;
      streamLogin = null;
      currentViewerCount = 0;
      video.classList.remove('active');
      document.getElementById('idle-screen').style.display = '';
      document.getElementById('meta-overlay').style.display = 'none';
      document.getElementById('quality-overlay').style.display = 'none';
      document.getElementById('meta-title').textContent = '';
      document.getElementById('meta-game').textContent = '';
      document.getElementById('meta-streamer-text').textContent = '';
      if (qualityOverlayTimer) { clearTimeout(qualityOverlayTimer); qualityOverlayTimer = null; }
      if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
      stopHeartbeat();
      stopStallWatch();
    }

    // ── Stream info polling (metadata) ───────────────────────────────────────

    function fetchStreamInfo() {
      if (!streamLogin) return;
      fetch('/stream-info/' + streamLogin)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.viewerCount) setViewerCount(data.viewerCount);
          if (data.title !== undefined) document.getElementById('meta-title').textContent = data.title;
          if (data.game !== undefined) document.getElementById('meta-game').textContent = data.game;
          updateMetaStreamer();
        })
        .catch(function() {});
    }

    function startStreamInfoPolling() {
      if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
      fetchStreamInfo();
      pollingInterval = setInterval(fetchStreamInfo, 60000);
    }

    // ── Heartbeat ────────────────────────────────────────────────────────────
    // Post playback progress (and any batched errors) so the server can spot a
    // frozen playhead and force a rebuild. Only runs while a stream is active.

    var heartbeatTimer = null;

    // Seconds of buffered media ahead of the playhead. ~0 while the feed is
    // alive means starvation (the append side stopped keeping up).
    function bufferAhead() {
      var t = video.currentTime;
      for (var i = 0; i < video.buffered.length; i++) {
        if (t >= video.buffered.start(i) - 0.1 && t <= video.buffered.end(i) + 0.1) {
          return video.buffered.end(i) - t;
        }
      }
      return 0; // playhead isn't inside any buffered range
    }

    // End of the contiguous buffered range the playhead sits in, or -1 if the
    // playhead has fallen outside every buffered range.
    function currentRangeEnd() {
      var t = video.currentTime;
      for (var i = 0; i < video.buffered.length; i++) {
        if (t >= video.buffered.start(i) - 0.1 && t <= video.buffered.end(i) + 0.1) {
          return video.buffered.end(i);
        }
      }
      return -1;
    }

    // True when there's a hole in the buffered timeline ahead of the playhead:
    // media exists beyond where the current contiguous range ends (or, if the
    // playhead is already outside all ranges, beyond the playhead). This is the
    // signature the player won't cross on its own — a dropped/discontinuous
    // segment. (Unlike a plain live-edge wait, there is buffered media past it.)
    function gapAhead() {
      var end = currentRangeEnd();
      var edge = end < 0 ? video.currentTime : end;
      for (var i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) > edge + 0.1) return true;
      }
      return false;
    }

    // If the playhead is stuck before a hole with buffered media beyond it,
    // returns the start of the nearest range past the hole; else -1. Used both
    // to seek across the gap and to bound the jump distance.
    function gapJumpTarget() {
      var end = currentRangeEnd();
      var edge = end < 0 ? video.currentTime : end;
      var best = -1;
      for (var i = 0; i < video.buffered.length; i++) {
        var s = video.buffered.start(i);
        if (s > edge + 0.1 && (best < 0 || s < best)) best = s;
      }
      return best;
    }

    function sendHeartbeat() {
      if (!deviceHlsId) return;
      var errs = receiverErrors;
      receiverErrors = [];
      var jumps = gapJumpNotes;
      gapJumpNotes = [];
      var now = Date.now();
      var bufEnd = video.buffered.length ? video.buffered.end(video.buffered.length - 1) : 0;
      fetch('/receiver-heartbeat/' + deviceHlsId, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          seq: activeStreamSeq,
          currentTime: video.currentTime || 0,
          paused: video.paused,
          errors: errs,
          gapJumps: jumps,
          readyState: video.readyState,
          networkState: video.networkState,
          bufferAhead: +bufferAhead().toFixed(2),
          bufferedEnd: +bufEnd.toFixed(2),
          gapAhead: gapAhead(),
          queueLen: appendQueue.length,
          appending: appending,
          msReadyState: mediaSource ? mediaSource.readyState : 'none',
          lastAppendAgo: lastAppendAt ? +((now - lastAppendAt) / 1000).toFixed(1) : -1,
          lastFetchAgo: lastFetchAt ? +((now - lastFetchAt) / 1000).toFixed(1) : -1,
          videoError: video.error ? ('code=' + video.error.code) : ''
        }),
        keepalive: true
      }).catch(function() {
        // Don't lose errors/notes if a heartbeat fails to reach the server.
        if (errs.length) receiverErrors = errs.concat(receiverErrors).slice(0, 20);
        if (jumps.length) gapJumpNotes = jumps.concat(gapJumpNotes).slice(0, 10);
      });
    }

    function startHeartbeat() {
      if (heartbeatTimer) return;
      heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }

    // ── Gap-jump stall watchdog ──────────────────────────────────────────────
    // Detects a frozen playhead parked before a buffered-timeline hole and seeks
    // across it. Diagnostic notes ride the next heartbeat (logged server-side,
    // distinct from errors). If a jump can't recover playback, the playhead
    // stays frozen and the server's rebuild watchdog takes over.

    var stallTimer = null;
    var lastProgressTime = 0;  // last observed currentTime
    var lastProgressAt = 0;    // wallclock (ms) when currentTime last advanced
    var gapJumpNotes = [];

    function checkStall() {
      // Only meaningful once playback has started and isn't intentionally idle.
      if (!playbackStarted || video.paused || video.seeking) {
        lastProgressTime = video.currentTime;
        lastProgressAt = Date.now();
        return;
      }
      var t = video.currentTime;
      if (t > lastProgressTime + 0.05) {  // advancing normally
        lastProgressTime = t;
        lastProgressAt = Date.now();
        return;
      }
      if (Date.now() - lastProgressAt < GAP_STALL_MS) return;  // not stalled long enough

      var target = gapJumpTarget();
      if (target < 0) return;              // stalled but no gap ⇒ leave it to the rebuild
      var gap = target - t;
      if (gap > MAX_GAP_JUMP_S) return;    // implausibly large ⇒ leave it to the rebuild

      var to = target + 0.1;               // nudge just inside the next range
      try {
        video.currentTime = to;
      } catch (e) {
        reportError('gap-jump seek failed: ' + e);
        return;
      }
      // Re-arm so we don't hammer seeks while the jump settles.
      lastProgressTime = video.currentTime;
      lastProgressAt = Date.now();
      var note = 'gap-jump ' + t.toFixed(1) + 's -> ' + to.toFixed(2) + 's (gap ' + gap.toFixed(2) + 's)';
      console.log('[receiver]', note);
      if (gapJumpNotes.length < 10) gapJumpNotes.push(note);
    }

    function startStallWatch() {
      lastProgressTime = video.currentTime;
      lastProgressAt = Date.now();
      if (stallTimer) return;
      stallTimer = setInterval(checkStall, STALL_POLL_MS);
    }

    function stopStallWatch() {
      if (stallTimer) { clearInterval(stallTimer); stallTimer = null; }
    }

    // ── Overlays ─────────────────────────────────────────────────────────────

    function formatViewerCount(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return n.toString();
    }

    function setViewerCount(n) {
      currentViewerCount = n;
    }

    function updateMetaStreamer() {
      var name = streamLogin || '';
      var viewers = currentViewerCount ? ' - ' + formatViewerCount(currentViewerCount) + ' viewers' : '';
      document.getElementById('meta-streamer-text').textContent = name + viewers;
    }

    function showOverlays() {
      var qEl = document.getElementById('quality-overlay');
      var mEl = document.getElementById('meta-overlay');
      if (document.getElementById('quality-res').textContent) qEl.style.display = 'flex';
      if (activeStreamURL) mEl.style.display = 'flex';
      if (qualityOverlayTimer) clearTimeout(qualityOverlayTimer);
      qualityOverlayTimer = setTimeout(function() {
        qEl.style.display = 'none';
        mEl.style.display = 'none';
        qualityOverlayTimer = null;
      }, 5000);
    }

    // ── Remote control ───────────────────────────────────────────────────────

    window.addEventListener('keydown', function(e) {
      showOverlays();
      if (e.key === 'MediaPlayPause' || e.key === 'k') {
        video.paused ? video.play() : video.pause();
      }
    }, true);

    // ── Stop on visibility change (TV off / input switch) ────────────────────

    document.addEventListener('visibilitychange', function() {
      if (document.hidden && deviceHlsId) {
        var url = '/stop-cast/' + deviceHlsId;
        if (typeof navigator.sendBeacon === 'function') {
          navigator.sendBeacon(url);
        } else {
          fetch(url, { method: 'POST' }).catch(function() {});
        }
      }
    });

    // ── Boot ─────────────────────────────────────────────────────────────────

    var bootStarted = false;
    function boot() {
      if (bootStarted) return;
      bootStarted = true;
      try {
        var ctx = cast.framework.CastReceiverContext.getInstance();
        var appData = ctx.getApplicationData();
        if (appData && appData.sessionId) {
          identifyAndStart(appData.sessionId);
          return;
        }
      } catch(e) {}
      startStreamPoll();
    }

    var identifyDeadline = 0;
    function identifyAndStart(sessionId) {
      if (!identifyDeadline) identifyDeadline = Date.now() + 30000;
      fetch('/receiver-session/' + sessionId)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data && data.hlsID) {
            deviceHlsId = data.hlsID;
            startStreamPoll();
          } else if (Date.now() < identifyDeadline) {
            setTimeout(function() { identifyAndStart(sessionId); }, 500);
          }
        })
        .catch(function() {
          if (Date.now() < identifyDeadline) {
            setTimeout(function() { identifyAndStart(sessionId); }, 1000);
          }
        });
    }

    try {
      var castCtx = cast.framework.CastReceiverContext.getInstance();
      castCtx.addEventListener(cast.framework.system.EventType.READY, boot);
      castCtx.start({ disableIdleTimeout: true });
    } catch(e) {}

    // Fallback in case READY never fires.
    setTimeout(boot, 5000);
  </script>
</body>
</html>
